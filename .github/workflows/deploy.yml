name: Deploy Izin Sedayu to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Enhance UI and UX Design V2/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: './Enhance UI and UX Design V2'
        run: npm ci

      - name: 🚀 Build Project (Vite)
        working-directory: './Enhance UI and UX Design V2'
        run: npm run build

      - name: 🌐 Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Enhance UI and UX Design V2/dist'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
